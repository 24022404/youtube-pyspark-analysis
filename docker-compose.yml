version: '3.8'

services:
  # ==========================================
  # 1. HADOOP ECOSYSTEM (Lưu trữ phân tán)
  # ==========================================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: youtube-namenode
    restart: always
    ports:
      - "9870:9870"   # Web UI của HDFS
      - "9000:9000"   # Cổng kết nối file system
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data:/data_input  # Mount dữ liệu đầu vào từ máy thật
    environment:
      - CLUSTER_NAME=youtube-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    networks:
      - youtube-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: youtube-datanode
    restart: always
    depends_on:
      - namenode
    volumes:
      - datanode_data:/hadoop/dfs/data
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    networks:
      - youtube-net

  # ==========================================
  # 2. STREAMING CORE (Kafka & Zookeeper)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: youtube-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - youtube-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: youtube-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - youtube-net

  # ==========================================
  # 3. STORAGE & PROCESSING
  # ==========================================
  mongodb:
    image: mongo:latest
    container_name: youtube-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - youtube-net

  # Producer (Gửi dữ liệu vào Kafka)
  producer:
    build: .
    container_name: youtube-producer
    command: python 06_kafka_producer.py
    restart: on-failure
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - youtube-net

  # Processor (Spark Streaming - Xử lý chính)
  spark-processor:
    build: .
    container_name: youtube-processor
    command: python 07_realtime_analysis.py
    volumes:
      - ./data:/app/data
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGO_URI=mongodb://mongodb:27017/
      # Cấu hình để Spark biết HDFS ở đâu (quan trọng)
      - HADOOP_USER_NAME=root
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    depends_on:
      - kafka
      - mongodb
      - namenode
    networks:
      - youtube-net

  # ==========================================
  # 4. APPLICATION & UI
  # ==========================================
  api:
    build: .
    container_name: youtube-api
    command: python 09_api_server.py
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    depends_on:
      - mongodb
    networks:
      - youtube-net

  frontend:
    image: nginx:alpine
    container_name: youtube-frontend
    volumes:
      - ./08_dashboard.html:/usr/share/nginx/html/index.html
    ports:
      - "8080:80"
    networks:
      - youtube-net

  # Jupyter Lab (Code & Research Environment)
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: youtube-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MONGO_URI=mongodb://mongodb:27017/
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - ./:/home/jovyan/work
    user: root
    networks:
      - youtube-net
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''

networks:
  youtube-net:
    driver: bridge

volumes:
  mongodb_data:
  namenode_data:
  datanode_data: