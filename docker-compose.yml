services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"  # Web UI
      - "9000:9000"  # HDFS (cho PySpark)
    volumes:
      - namenode_data:/hadoop/dfs/name
      # Ánh xạ thư mục data để HDFS có thể "thấy" dữ liệu thô
      # ĐÃ SỬA: Đường dẫn ./data (so với vị trí file docker-compose.yml)
      - ./data:/data_input 
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1 
    networks:
      - hadoop_network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    depends_on:
      - namenode
    volumes:
      - datanode_data:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870 
    networks:
      - hadoop_network

  spark-jupyter-lab:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-jupyter-lab
    restart: always
    depends_on:
      - namenode
      - datanode
    ports:
      - "8888:8888"  # Jupyter Lab UI
      - "4040:4040"  # Spark UI
    volumes:
      # Ánh xạ toàn bộ thư mục dự án vào container
      # ĐÃ SỬA: Dùng "." để ánh xạ thư mục hiện tại (chính là youtube-pyspark-analysis)
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      # Cấp quyền để có thể cài đặt thư viện
      - GRANT_SUDO=yes
    networks:
      - hadoop_network
    # Cài đặt các thư viện Python còn thiếu
    command: >
      bash -c "pip install kagglehub google-api-python-client findspark seaborn &&
      start-notebook.sh --NotebookApp.token=''"

volumes:
  namenode_data:
  datanode_data:

networks:
  hadoop_network: