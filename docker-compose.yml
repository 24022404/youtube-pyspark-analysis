version: '3.8'

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: always
    ports:
      - "9870:9870"  # Web UI
      - "9000:9000"  # HDFS (cho PySpark)
    volumes:
      - namenode_data:/hadoop/dfs/name
      # Ánh xạ thư mục data của bạn vào container
      - ./youtube-pyspark-analysis/data:/data_input 
    environment:
      - CLUSTER_NAME=test
      # Chỉ định cổng HDFS là 9000
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      # Quan trọng: Đặt là 1 vì chỉ có 1 datanode
      - HDFS_CONF_dfs_replication=1 
    networks:
      - hadoop_network

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    restart: always
    depends_on:
      - namenode
    volumes:
      - datanode_data:/hadoop/dfs/data
    environment:
      # Báo cho datanode biết cổng của namenode
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      # Dòng quan trọng: Bắt datanode đợi namenode
      - SERVICE_PRECONDITION=namenode:9870 
    networks:
      - hadoop_network

volumes:
  namenode_data:
  datanode_data:

networks:
  hadoop_network: